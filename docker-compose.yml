version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: graphmind_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-graphmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-graphmind_secret}
      POSTGRES_DB: ${POSTGRES_DB:-graphmind_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-graphmind} -d ${POSTGRES_DB:-graphmind_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: graphmind_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: graphmind_api
    restart: always
    ports:
      - "8300:8300"
    environment:
      - HOST=0.0.0.0
      - PORT=8300
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-graphmind}:${POSTGRES_PASSWORD:-graphmind_secret}@postgres:5432/${POSTGRES_DB:-graphmind_db}
      - REDIS_URL=redis://redis:6379/0
      - DEFAULT_PROVIDER=${DEFAULT_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: graphmind_web
    restart: always
    ports:
      - "3300:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8300

    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
