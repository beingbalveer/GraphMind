[project]
name = "ai-core"
version = "0.1.0"
description = "Provider-agnostic AI and LLM abstraction package for GraphMind"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0",
    "google-genai>=0.1.0",
    "openai>=1.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_core"]
