[project]
name = "graphmind-workspace"
version = "0.1.0"
description = "GraphMind - AI-native Knowledge Workspace"
authors = [{ name = "GraphMind Team" }]
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
]

[tool.uv.workspace]
members = ["apps/api", "packages/ai-core"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps/api/tests", "packages/ai-core/tests"]
python_files = ["test_*.py"]
pythonpath = ["apps/api/src", "packages/ai-core/src"]
